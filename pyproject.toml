[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.1.0"
description = "Turn a brief into a vertical short video: script, cloned voice, timeline, Remotion render, QA."
requires-python = ">=3.11"
dependencies = ["numpy", "soundfile"]

[project.optional-dependencies]
deploy = ["runpod>=2.3"]
quality = ["soxr", "scipy"]
recognition = ["faster-whisper", "av>=14,<19"]
llm = ["anthropic", "pydantic"]
test = ["pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["reelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
